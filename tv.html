<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modo TV · Planejamento de Clientes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23241b42'/%3E%3Ccircle cx='12' cy='16' r='5' fill='%23a797f8'/%3E%3Ccircle cx='20.5' cy='16' r='5' fill='none' stroke='%23f2effc' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tv.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"><i id="progress"></i></div>

<header class="top">
  <div class="brand">
    <div class="mono" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="4.2" fill="currentColor" opacity=".55"/><circle cx="15" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </div>
    <div><strong>Planejamento de Clientes</strong><span id="tv-info">Gerando dados…</span></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Telas"></nav>
  <div class="actions">
    <span class="clock" id="clock"></span>
    <button class="tbtn" id="btn-pause" type="button" title="Pausar / continuar (espaço)" aria-label="Pausar o giro">
      <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="tbtn" id="btn-full" type="button" title="Tela cheia (F)" aria-label="Tela cheia">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="tbtn" id="btn-settings" type="button" title="Configurar o giro" aria-label="Configurar o giro">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</header>

<main class="stage" id="stage"></main>

<footer class="foot"><div class="ticker" id="ticker"></div></footer>

<div class="settings" id="settings" hidden>
  <div class="settings-box" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">Giro das telas</h2>
    <label class="field">Tempo de cada tela
      <select id="cfg-seconds">
        <option value="10">10 s</option><option value="15">15 s</option><option value="20">20 s</option><option value="30">30 s</option>
        <option value="45">45 s</option><option value="60">1 min</option><option value="120">2 min</option>
      </select></label>
    <div class="field">Telas no giro<div class="checks" id="cfg-screens"></div></div>
    <p class="hint">Setas trocam de tela, espaço pausa, F alterna a tela cheia e Esc fecha esta janela. A escolha fica salva neste navegador.</p>
    <div class="settings-foot"><a href="index.html">Abrir o painel</a><button class="tbtn text" id="cfg-close" type="button">Fechar</button></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/analytics.js"></script>
<script src="js/map.js"></script>
<script src="js/tv.js"></script>
</body>
</html>
